                - httpStatusCode
              example:
                code: 20052
                message: A custom field mapping named 'LeadScore' already exists for
                  this account.
                httpStatusCode: 409
                userError: true
                params:
                  category: MEASURE
                  name: LeadScore
                  id: convinsights_mapping_01m31967b7em08vh1pqgbam3mj
        429:
