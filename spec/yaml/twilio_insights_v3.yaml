  /v3/ControlPlane/ConversationInsights/CustomFieldMappings:
    servers:
    - url: https://insights.twilio.com
    post:
      summary: Register a custom measure field mapping
      description: "Registers a custom field for an account under a category, sourced\
        \ from an\nupstream entity \u2014 selected via the `entityMetadata.sourceType`\n\
        discriminator, which determines the required shape of `entityMetadata`.\n\
        Only the `MEASURE` category is supported for now.\n\nFor sources with a resolvable\
        \ field-path concept, validates that\n`entityMetadata.field` resolves on the\
        \ entity's latest active version by\ncalling that source's own resolution\
        \ API (the Intelligence fetch-operator\nAPI for `sourceType: INTELLIGENCE_OPERATOR`),\
        \ then performs an idempotent\nupsert keyed on (accountSid, category, name).\n\
        `entityMetadata.sourceType` plus that variant's own identity field\n(`operatorId`\
        \ for `INTELLIGENCE_OPERATOR`) must match the existing\nregistration's owner\
        \ for the upsert to succeed \u2014 a mismatch returns\n`409`. Enforces the\
        \ per-account, per-category capacity limit.\n"
      tags:
      - TwilioInsightsConfig
      operationId: CreateCustomFieldMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldMappingRequest'
            examples:
              measure_from_intelligence_operator:
                summary: Register a custom measure sourced from an Intelligence operator
                value:
                  category: MEASURE
                  name: LeadScore
                  description: Lead quality score derived from sentiment analysis
                  entityMetadata:
                    sourceType: INTELLIGENCE_OPERATOR
                    operatorId: OPxxxx
                    operatorName: Sentiment Analysis
                    field: leadScore
      responses:
        '200':
          description: The `name` was already registered for this operator and was
            updated in-place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldMappingResponse'
