openapi: 3.0.1
info:
  title: Twilio - Insights
  description: 'The Twilio Insights v3 API provides semantic query access to Conversations

    analytics data. Resources include synchronous Query, Metadata, and asynchronous

    QueryJobs for long-running queries.

    '
  termsOfService: https://www.twilio.com/legal/tos
  contact:
    name: Twilio Support
    url: https://support.twilio.com
    email: support@twilio.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.1.0
  x-twilio:
    apiStandards: v1.0
servers:
- url: https://insights.twilio.com
security:
- basic_apikey_or_accountsid: []
tags:
- name: TwilioInsights
  description: Twilio Insights synchronous Query and Metadata resources.
- name: TwilioInsightsAsync
  description: Twilio Insights asynchronous QueryJobs resource (long-running query
    operations).
- name: TwilioInsightsConfig
  description: Twilio Insights Config API for custom measure field mapping registration.
components:
  securitySchemes:
    basic_apikey_or_accountsid:
      scheme: basic
      type: http
      description: This API uses [basic authentication](https://www.twilio.com/docs/glossary/what-is-basic-authentication).
        Use an [API key](https://www.twilio.com/docs/iam/api-keys) as the username
        and the API key secret as the password. You can also use your account SID
        and auth token, but limit their use to local testing.
  responses:
    UnprocessableContentError:
      description: Unprocessable content (idempotency key payload mismatch)
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                description: Twilio-specific error code
                type: integer
                format: int32
              message:
                description: A human readable error message
                type: string
              httpStatusCode:
                description: HTTP response status code
                type: integer
                format: int32
              userError:
                description: Whether the error is a user error (true) or a system
                  error (false)
                type: boolean
              params:
                description: A map of parameters related to the error, for example,
                  a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                  information
                type: object
                additionalProperties:
                  type: string
            required:
            - code
            - message
            - httpStatusCode
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                description: Twilio-specific error code
                type: integer
                format: int32
              message:
                description: A human readable error message
                type: string
              httpStatusCode:
                description: HTTP response status code
                type: integer
                format: int32
              userError:
                description: Whether the error is a user error (true) or a system
                  error (false)
                type: boolean
              params:
                description: A map of parameters related to the error, for example,
                  a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                  information
                type: object
                additionalProperties:
                  type: string
            required:
            - code
            - message
            - httpStatusCode
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                description: Twilio-specific error code
                type: integer
                format: int32
              message:
                description: A human readable error message
                type: string
              httpStatusCode:
                description: HTTP response status code
                type: integer
                format: int32
              userError:
                description: Whether the error is a user error (true) or a system
                  error (false)
                type: boolean
              params:
                description: A map of parameters related to the error, for example,
                  a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                  information
                type: object
                additionalProperties:
                  type: string
            required:
            - code
            - message
            - httpStatusCode
    UnauthorizedError:
      description: Unauthorized request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                description: Twilio-specific error code
                type: integer
                format: int32
              message:
                description: A human readable error message
                type: string
              httpStatusCode:
                description: HTTP response status code
                type: integer
                format: int32
              userError:
                description: Whether the error is a user error (true) or a system
                  error (false)
                type: boolean
              params:
                description: A map of parameters related to the error, for example,
                  a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                  information
                type: object
                additionalProperties:
                  type: string
            required:
            - code
            - message
            - httpStatusCode
    ForbiddenError:
      description: Forbidden request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                description: Twilio-specific error code
                type: integer
                format: int32
              message:
                description: A human readable error message
                type: string
              httpStatusCode:
                description: HTTP response status code
                type: integer
                format: int32
              userError:
                description: Whether the error is a user error (true) or a system
                  error (false)
                type: boolean
              params:
                description: A map of parameters related to the error, for example,
                  a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                  information
                type: object
                additionalProperties:
                  type: string
            required:
            - code
            - message
            - httpStatusCode
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                description: Twilio-specific error code
                type: integer
                format: int32
              message:
                description: A human readable error message
                type: string
              httpStatusCode:
                description: HTTP response status code
                type: integer
                format: int32
              userError:
                description: Whether the error is a user error (true) or a system
                  error (false)
                type: boolean
              params:
                description: A map of parameters related to the error, for example,
                  a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                  information
                type: object
                additionalProperties:
                  type: string
            required:
            - code
            - message
            - httpStatusCode
    RateLimitError:
      description: Too Many requests (rate limit exceeded for request originating
        from public API)
      headers:
        X-RateLimit-Limit:
          description: Maximum number of requests allowed in the time window
          schema:
            type: integer
          example: 5
        X-RateLimit-Remaining:
          description: Number of requests remaining in the current time window
          schema:
            type: integer
          example: 0
        X-RateLimit-Reset:
          description: Time in seconds until the rate limit resets
          schema:
            type: integer
          example: 45
        X-Rate-Limit-Limit:
          $ref: '#/components/headers/X-Rate-Limit-Limit'
        X-Rate-Limit-Remaining:
          $ref: '#/components/headers/X-Rate-Limit-Remaining'
        X-Rate-Limit-Config:
          $ref: '#/components/headers/X-Rate-Limit-Config'
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                description: Twilio-specific error code
                type: integer
                format: int32
              message:
                description: A human readable error message
                type: string
              httpStatusCode:
                description: HTTP response status code
                type: integer
                format: int32
              userError:
                description: Whether the error is a user error (true) or a system
                  error (false)
                type: boolean
              params:
                description: A map of parameters related to the error, for example,
                  a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                  information
                type: object
                additionalProperties:
                  type: string
            required:
            - code
            - message
            - httpStatusCode
  headers:
    X-Rate-Limit-Limit:
      schema:
        type: string
    X-Rate-Limit-Remaining:
      schema:
        type: string
    X-Rate-Limit-Config:
      schema:
        type: string
  schemas:
    PaginationMeta:
      type: object
      description: 'The pagination metadata containing navigation tokens and result
        information.

        By convention, this schema should be added to the response payload''s

        ''meta'' attribute.

        '
      required:
      - key
      - pageSize
      properties:
        key:
          type: string
          nullable: false
          description: 'The key of the list property contains the actual data items.

            This enables programmatic iteration over paginated results.

            '
          example: items
        pageSize:
          type: integer
          nullable: false
          description: 'The actual number of items returned in this response.

            May be less than the requested pageSize for the last page.

            '
          example: 20
        previousToken:
          type: string
          nullable: true
          description: 'Token to fetch the previous page of results.

            Only included if there is a previous page, otherwise omitted.

            '
          example: eyJwYWdlIjowLCJxdWVyeSI6ImJvb2tzIn0=
        nextToken:
          type: string
          nullable: true
          description: 'Token to fetch the next page of results.

            Only included if there is a next page, otherwise omitted.

            '
          example: eyJwYWdlIjoyLCJxdWVyeSI6ImJvb2tzIn0=
    QueryDefinition:
      type: object
      description: Structured query definition that specifies what data to retrieve
        and how to filter, group, and order it
      properties:
        measures:
          type: array
          description: Array of measures to retrieve, representing quantitative values
            or metrics to be calculated
          items:
            type: string
          example:
          - OperatorResult.Count
        dimensions:
          type: array
          description: Array of dimensions to retrieve, representing categorical attributes
            for grouping and organizing data
          items:
            type: string
          example:
          - DateCreated
          - OperatorResults
        filters:
          type: array
          description: Nested filter conditions. Always use `op` and `expressions`.
          items:
            type: object
            required:
            - expressions
            properties:
              op:
                type: string
                enum:
                - AND
                - OR
                - EQ
                - NE
                - GT
                - LT
                - IN
                example: AND
              expressions:
                type: array
                items:
                  type: object
                  required:
                  - op
                  - field
                  properties:
                    op:
                      type: string
                      enum:
                      - AND
                      - OR
                      - EQ
                      - NE
                      - GT
                      - LT
                      - IN
                      example: IN
                    field:
                      type: string
                      example: OperatorResult.Value
                    values:
                      type: array
                      items:
                        type: string
                      example:
                      - positive
                      - negative
        orderBy:
          type: array
          description: Specifications for sorting the query results by specific fields
            in ascending or descending order
          items:
            type: object
            properties:
              field:
                type: string
                description: Dimension or measure to order by
                example: OperatorResults.CreatedDate
              direction:
                type: string
                description: Sort order direction, ascending or descending
                enum:
                - ASC
                - DESC
                example: DESC
    InsightsQueryRequest:
      type: object
      required:
      - query
      properties:
        domain:
          type: string
          example: Conversations
          description: The business domain to execute the query against
        query:
          $ref: '#/components/schemas/QueryDefinition'
    InsightsQueryResponse:
      type: object
      properties:
        domain:
          type: string
          example: Insights
          description: Indicates the business domain the query was executed against
        items:
          type: array
          description: Array of result objects containing the query results. Each
            object contains properties matching the requested measures and dimensions.
          items:
            type: object
            description: Query result object with dynamic properties based on requested
              measures and dimensions.
            additionalProperties:
              description: Dynamic property values based on requested measures and
                dimensions.
          example:
          - Id: conv1
            Languages:
            - en
            Channels:
            - voice
            OperatorResult.Value: positive
          - Id: conv2
            Languages:
            - en
            - es
            Channels:
            - chat
            OperatorResult.Value: negative
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    InsightsMetadataResponse:
      type: object
      description: Response containing metadata about available cubes, measures, and
        dimensions for a domain
      properties:
        domain:
          type: string
          example: Insights
          description: The business domain name for which metadata is being provided
        cubes:
          type: array
          description: List of data cubes available in the domain, each containing
            measures and dimensions
          items:
            type: object
            required:
            - name
            - measures
            - dimensions
            properties:
              name:
                type: string
                description: Name of the cube, used as a reference in queries
              description:
                type: string
                description: Human-readable description of what the cube represents
              measures:
                type: array
                description: List of measures available in the cube, representing
                  quantitative values that can be aggregated
                items:
                  type: object
                  required:
                  - name
                  - type
                  properties:
                    name:
                      type: string
                      description: Identifier used to reference this measure in queries
                    description:
                      type: string
                      description: Detailed explanation of what this measure represents
                    type:
                      type: string
                      description: Type of the measure
                    aggregation:
                      type: string
                      description: Aggregation type for the measure (e.g., sum, count,
                        average)
              dimensions:
                type: array
                description: List of dimensions available in the cube, representing
                  categorical attributes for grouping data
                items:
                  type: object
                  required:
                  - name
                  - type
                  properties:
                    name:
                      type: string
                      description: Identifier used to reference this dimension in
                        queries
                    description:
                      type: string
                      description: Detailed explanation of what this dimension represents
                    type:
                      type: string
                      description: Data type of the dimension (e.g., string, number,
                        boolean, date)
    LongRunningOperationStatus:
      description: The valid status values for long-running operations.
      type: string
      enum:
      - PENDING
      - RUNNING
      - CANCELLED
      - COMPLETED
      - FAILED
    OperationError:
      description: The error details for a failed operation, embedded inside a 200
        OK operation envelope.
      type: object
      required:
      - code
      - message
      - httpStatusCode
      properties:
        code:
          description: Twilio-specific error code
          type: integer
          format: int32
          example: 50001
        message:
          description: A human readable error message
          type: string
          example: Query execution timeout exceeded
        httpStatusCode:
          description: HTTP status code that would have been returned for a synchronous
            failure
          type: integer
          format: int32
          example: 504
        detail:
          description: Additional context about the failure
          type: string
          nullable: true
          example: Query exceeded the 120s execution limit.
    QueryJobSubmitResponse:
      description: 'The initial 202 response for an async query submission.

        Conforms to LongRunningOperation202Response from Twilio API Standards.

        '
      type: object
      additionalProperties: true
      required:
      - operationId
      - status
      - statusUrl
      - createdAt
      properties:
        operationId:
          type: string
          format: Proc_JobTtid
          description: The unique identifier for the asynchronous query operation,
            in TTID format.
          example: proc_job_01h9d8r0vte3hz8tykdj329t7r
        status:
          $ref: '#/components/schemas/LongRunningOperationStatus'
        statusUrl:
          type: string
          format: uri
          description: The URI to poll for operation status.
          example: https://insights.twilio.com/v3/InsightsDomains/Conversations/QueryJobs/proc_job_01h9d8r0vte3hz8tykdj329t7r
        createdAt:
          type: string
          format: date-time
          description: The time when the operation was accepted, in RFC 3339 UTC format.
          example: '2026-05-25T14:30:00Z'
    QueryJobStatusResponse:
      description: 'The status response for an async query operation.

        Conforms to LongRunningOperationStatusResponse from Twilio API Standards.

        '
      type: object
      additionalProperties: true
      required:
      - operationId
      - status
      - createdAt
      properties:
        operationId:
          type: string
          format: Proc_JobTtid
          description: The unique identifier for the asynchronous query operation,
            in TTID format.
          example: proc_job_01h9d8r0vte3hz8tykdj329t7r
        status:
          $ref: '#/components/schemas/LongRunningOperationStatus'
        statusUrl:
          type: string
          format: uri
          example: https://insights.twilio.com/v3/InsightsDomains/Conversations/QueryJobs/proc_job_01h9d8r0vte3hz8tykdj329t7r
        createdAt:
          type: string
          format: date-time
          example: '2026-05-25T14:30:00Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: The time when the operation reached a terminal state (CANCELLED,
            COMPLETED, or FAILED), in RFC 3339 UTC format. Null while the operation
            is still PENDING or RUNNING.
          example: '2026-05-25T14:32:17Z'
        error:
          nullable: true
          description: The error details, present only when status is FAILED.
          allOf:
          - $ref: '#/components/schemas/OperationError'
        resultUrl:
          type: string
          format: uri
          nullable: true
          description: 'The URL to retrieve query results, present only when status
            is COMPLETED.

            Supports pagination via the pageSize and pageToken query parameters.

            '
          example: https://insights.twilio.com/v3/InsightsDomains/Conversations/QueryJobs/proc_job_01h9d8r0vte3hz8tykdj329t7r/Results
        resultId:
          type: string
          nullable: true
          description: 'The identifier of the results resource, present only when
            status is COMPLETED.

            Equal to operationId, since results are keyed by the operation ID.

            '
          example: proc_job_01h9d8r0vte3hz8tykdj329t7r
        resultRetentionPeriod:
          type: string
          format: duration
          nullable: true
          description: The duration for how long results are retained, in ISO 8601
            format.
          example: P7D
    QueryJobListResponse:
      description: A paginated list of async query operations for the account.
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueryJobStatusResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    MappingCategory:
      type: string
      description: "The category of the custom field. Supported values:\n- `MEASURE`:\
        \ a numeric value that can be aggregated and queried as a\n  measure in Conversations\
        \ Insights.\n"
      enum:
      - MEASURE
    SourceType:
      type: string
      description: "The kind of entity that supplies the custom field's value. Each\
        \ value has\na matching property on `entityMetadata` that carries that source's\n\
        details. Supported values:\n- `INTELLIGENCE_OPERATOR`: the value is read from\
        \ the output of a\n  Conversational Intelligence operator. Details go in\n\
        \  `entityMetadata.intelligenceOperator`.\n"
      enum:
      - INTELLIGENCE_OPERATOR
    IntelligenceOperatorSource:
      type: object
      description: "Details of a custom field whose value is read from a Conversational\n\
        Intelligence operator's output. The operator must:\n- have an active version;\n\
        - have `outputFormat` `JSON` (`TEXT` and `CLASSIFICATION` operators\n  are\
        \ rejected).\n\nRequests that reference an ineligible operator are rejected\
        \ with `400`.\n"
      required:
      - operatorId
      - field
      properties:
        operatorId:
          type: string
          description: 'The ID of the Conversational Intelligence operator whose output

            supplies this field''s value. Must match

            `^intelligence_operator_[0-7][0-9a-z]{25}$`. Cannot be changed after

            registration.

            '
          pattern: ^intelligence_operator_[0-7][0-9a-z]{25}$
          example: intelligence_operator_01kcgy1ew0e9x8re6jq542zt8b
        operatorName:
          type: string
          description: 'Optional, display-only name of the operator. Stored as supplied
            and

            not validated against the operator.

            '
          example: Sentiment Analysis
        field:
          type: string
          description: "Path to the property in the operator's output schema that\
            \ supplies\nthis field's value. Rules:\n- one or two segments separated\
            \ by `.` \u2014 a top-level property\n  (`leadScore`) or one level of\
            \ nesting (`scores.leadScore`);\n- each segment contains only letters,\
            \ digits and `_`; array\n  indexing (such as `items[0]`) is not supported;\n\
            - the path must exist in the output schema of the operator's\n  latest\
            \ active version and resolve to a property of type `number`\n  or `integer`.\n"
          pattern: ^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)?$
          example: leadScore
    EntityMetadata:
      type: object
      description: 'Identifies the entity that supplies this field''s value. `sourceType`

        selects the source, and the property named for that source carries its

        details. Exactly that one source property must be present:


        | `sourceType` | Required property |

        |---|---|

        | `INTELLIGENCE_OPERATOR` | `intelligenceOperator` |


        A request whose `sourceType` doesn''t match the source property it sends,

        or that sends any other property, is rejected with `400`.

        '
      additionalProperties: false
      required:
      - sourceType
      properties:
        sourceType:
          $ref: '#/components/schemas/SourceType'
        intelligenceOperator:
          $ref: '#/components/schemas/IntelligenceOperatorSource'
    CustomFieldMappingRequest:
      type: object
      description: 'Registration payload for a single custom field. The mapping is
        created in

        the account identified by the request''s credentials.

        '
      required:
      - category
      - name
      - entityMetadata
      properties:
        category:
          $ref: '#/components/schemas/MappingCategory'
        name:
          type: string
          description: 'Name of the custom field, used to reference it in Insights
            queries.

            Contains only letters, digits and `_`, and must not be empty.

            Must be unique within the account across every `sourceType`;

            registering an existing name returns `409`. Cannot be changed after

            registration.

            '
          pattern: ^[A-Za-z0-9_]+$
          example: LeadScore
        description:
          type: string
          description: "Optional, free-text description of this custom field mapping,\
            \ up to\n150 characters. Display-only \u2014 not part of any uniqueness\
            \ check.\n"
          maxLength: 150
          example: Lead quality score derived from sentiment analysis
        entityMetadata:
          $ref: '#/components/schemas/EntityMetadata'
    CustomFieldMappingUpdateRequest:
      type: object
      description: 'Partial update of a custom field mapping. Only properties present
        in the

        body are changed; absent properties keep their current value. The body

        must contain at least one change: an empty body is rejected with `400`.

        Properties that cannot be updated (such as `name`, `category` or

        `operatorId`) are rejected with `400` rather than ignored.

        '
      additionalProperties: false
      minProperties: 1
      properties:
        entityMetadata:
          $ref: '#/components/schemas/EntityMetadataUpdate'
    EntityMetadataUpdate:
      type: object
      description: 'Updatable subset of `entityMetadata`. `sourceType` must equal
        the

        mapping''s current `sourceType` (it cannot be changed), and the property

        named for that source carries the fields to update:


        | `sourceType` | Update property | Updatable fields |

        |---|---|---|

        | `INTELLIGENCE_OPERATOR` | `intelligenceOperator` | `field` |

        '
      additionalProperties: false
      required:
      - sourceType
      properties:
        sourceType:
          $ref: '#/components/schemas/SourceType'
        intelligenceOperator:
          $ref: '#/components/schemas/IntelligenceOperatorSourceUpdate'
    IntelligenceOperatorSourceUpdate:
      type: object
      description: 'Updatable fields of a custom field mapping sourced from a Conversational

        Intelligence operator. At least one field must be present. Currently

        only `field` can be modified; `operatorId` and `operatorName` cannot be

        updated.

        '
      additionalProperties: false
      minProperties: 1
      properties:
        field:
          type: string
          description: 'New path to the property in the operator''s output schema.
            Follows the

            same rules as `field` at registration: one or two `.`-separated

            segments of letters, digits and `_`, resolving to a `number` or

            `integer` property on the operator''s latest active version.

            '
          pattern: ^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)?$
          example: scores.leadScore
    CustomFieldMappingResponse:
      type: object
      description: A registered custom field mapping.
      required:
      - category
      - name
      - entityMetadata
      properties:
        id:
          type: string
          description: The unique identifier of the custom field mapping.
          example: convinsights_mapping_01m31967b7em08vh1pqgbam3mj
        category:
          $ref: '#/components/schemas/MappingCategory'
        name:
          type: string
          description: Name of the custom field, unique within the account.
          example: LeadScore
        description:
          type: string
          description: "Optional, free-text description supplied at registration time.\n\
            Display-only \u2014 not part of any uniqueness check.\n"
          maxLength: 150
          example: Lead quality score derived from sentiment analysis
        entityMetadata:
          $ref: '#/components/schemas/EntityMetadata'
        createdAt:
          type: string
          format: date-time
          description: When the mapping was registered.
          example: '2026-08-13T14:30:00Z'
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the mapping was last modified via `PATCH`. Null until
            the first update.
          example: '2026-09-30T10:00:00Z'
    CustomFieldMappingsList:
      type: object
      description: 'A page of custom field mappings registered for the account. The
        mappings

        are under `items`, and `meta.key` is `items`.

        '
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldMappingResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CustomFieldCapacity:
      type: object
      description: 'Custom field mapping slot capacity for the account, by category.
        Only the

        `measure` category is supported for now; the object is empty when custom

        measures are not available for the account.

        '
      properties:
        measure:
          $ref: '#/components/schemas/CategoryCapacity'
    CategoryCapacity:
      type: object
      description: 'Slots consumed and remaining for the measure category. By default
        an

        account can register up to 3 custom measures, so `consumed + remaining`

        is the account''s limit. Registering a new mapping when `remaining` is

        `0` returns `403`.

        '
      required:
      - consumed
      - remaining
      properties:
        consumed:
          type: integer
          minimum: 0
          description: Number of custom field mapping slots already registered.
          example: 1
        remaining:
          type: integer
          minimum: 0
          description: Number of custom field mapping slots still available.
          example: 2
