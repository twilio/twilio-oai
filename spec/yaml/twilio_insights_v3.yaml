  /v3/ControlPlane/ConversationInsights/CustomFieldMappings:
    servers:
    - url: https://insights.twilio.com
    post:
      summary: Register a custom measure field mapping
      description: "Registers a custom field for the account. `entityMetadata.sourceType`\n\
        selects where the field's value comes from, and the matching property on\n\
        `entityMetadata` (`intelligenceOperator` for `INTELLIGENCE_OPERATOR`)\ncarries\
        \ its details. Only the `MEASURE` category is supported for now.\n\nThe request\
        \ is validated before the mapping is created:\n- `name` contains only letters,\
        \ digits and `_`, and is not already\n  registered for the account (otherwise\
        \ `409`);\n- `description`, when present, is at most 150 characters;\n- for\
        \ `INTELLIGENCE_OPERATOR`, the operator has an active version with\n  `outputFormat`\
        \ `JSON`, and `entityMetadata.intelligenceOperator.field`\n  is one or two\
        \ `.`-separated segments that resolve to a `number` or\n  `integer` property\
        \ in that version's output schema (otherwise `400`);\n- the account has a\
        \ free slot in the category; by default an account can\n  register up to 3\
        \ custom measures (otherwise `403`). Use\n  `GET /v3/ControlPlane/ConversationInsights/CustomFieldMappingsCapacity`\n\
        \  to check the remaining slots.\n\nCreate-only: if a mapping with the same\
        \ `name` already exists for the\naccount, `409` is returned with the existing\
        \ mapping's `id` and nothing\nis changed. To modify an existing mapping, use\n\
        `PATCH /v3/ControlPlane/ConversationInsights/CustomFieldMappings/{mappingId}`.\n"
      tags:
      - TwilioInsightsConfig
      operationId: CreateCustomFieldMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldMappingRequest'
            examples:
              measure_from_intelligence_operator:
                summary: Register a custom measure sourced from an Intelligence operator
                value:
                  category: MEASURE
                  name: LeadScore
                  description: Lead quality score derived from sentiment analysis
                  entityMetadata:
                    sourceType: INTELLIGENCE_OPERATOR
                    intelligenceOperator:
                      operatorId: intelligence_operator_01kcgy1ew0e9x8re6jq542zt8b
                      operatorName: Sentiment Analysis
                      field: leadScore
      responses:
        '201':
          description: The custom field mapping was created.
          headers:
            ETag:
              description: ETag of the new mapping; supply it as `If-Match` on `PATCH`.
              schema:
                type: string
                example: '"2026-08-13T14:30:00Z"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldMappingResponse'
        '400':
          description: "The request is invalid. One of:\n- a required property (`category`,\
            \ `name`, `entityMetadata`,\n  `entityMetadata.sourceType`, `operatorId`,\
            \ `field`) is missing, or\n  `category` / `sourceType` is not a supported\
            \ value;\n- `name` is empty or contains characters other than letters,\n\
            \  digits and `_`, or `description` is longer than 150 characters;\n-\
            \ `entityMetadata` does not carry the property that matches its\n  `sourceType`,\
            \ or carries any other property;\n- `operatorId` is not a valid operator\
            \ ID;\n- the operator has no active version or its `outputFormat` is not\n\
            \  `JSON`;\n- `field` has more than two segments, contains unsupported\n\
            \  characters, or does not resolve to a `number` or `integer`\n  property\
            \ in the operator's output schema.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system
                      error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example,
                      a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                      information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
              example:
                code: 20050
                message: The 'field' value 'leadScore' does not resolve on the latest
                  active version of operator 'intelligence_operator_01kcgy1ew0e9x8re6jq542zt8b'.
                httpStatusCode: 400
                userError: true
        401:
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system
                      error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example,
                      a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                      information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
        '403':
          description: 'The account has reached its limit of custom measures (default
            3), or

            does not have access to custom field mappings.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
