    patch:
      summary: Update a custom field mapping
      description: 'Partially updates an existing custom field mapping. Only the properties

        present in the body are changed. The updatable properties depend on the

        mapping''s `sourceType`; for `INTELLIGENCE_OPERATOR`, only

        `entityMetadata.intelligenceOperator.field` can be updated today.


        The new `field` is validated the same way as at registration: it must be

        one or two `.`-separated segments of letters, digits and `_`, and resolve

        to a `number` or `integer` property in the output schema of the

        operator''s latest active version.


        The mapping''s `id`, `name`, `category`, `createdAt` and owning entity

        never change. Sending a `field` value equal to the current one is a no-op
        that

        returns `200` without modifying the mapping, so the operation is

        idempotent. Supply `If-Match` with the `ETag` returned by `GET`, `POST`

        or a previous `PATCH` to guard against concurrent updates.


        Values already ingested are not recomputed; results processed after the

        update use the new `field`.

        '
      tags:
      - TwilioInsightsConfig
      operationId: PatchCustomFieldMapping
      parameters:
      - name: mappingId
        in: path
        required: true
        description: The unique identifier of the custom field mapping, as returned
          in `id` when the mapping was created.
        schema:
          type: string
          example: convinsights_mapping_01m31967b7em08vh1pqgbam3mj
      - in: header
        name: If-Match
        required: false
        description: 'ETag of the custom field mapping, as returned in the `ETag`
          response header.

          When supplied, the update is applied only if the mapping has not changed

          since that ETag was issued; otherwise `412` is returned.

          '
        schema:
          type: string
          example: '"2026-08-13T14:30:00Z"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldMappingUpdateRequest'
            examples:
              update_intelligence_operator_field:
                summary: Point a custom measure at a different operator output field
                value:
                  entityMetadata:
                    sourceType: INTELLIGENCE_OPERATOR
                    intelligenceOperator:
                      field: scores.leadScore
      responses:
        '200':
          description: 'The mapping was updated, or the supplied values already matched
            and

            nothing changed.

            '
          headers:
            ETag:
              description: Current ETag of the mapping; supply it as `If-Match` on
                the next update.
              schema:
                type: string
                example: '"2026-09-30T10:00:00Z"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldMappingResponse'
        '400':
          description: "The request is invalid. One of:\n- a malformed body, an empty\
            \ body or source object (nothing to\n  update), a missing `entityMetadata.sourceType`,\
            \ or a `field` that\n  fails its pattern;\n- a property that cannot be\
            \ updated (for example `name`,\n  `category`, `operatorId`) is present;\n\
            - `entityMetadata.sourceType` does not match the mapping's current\n \
            \ `sourceType`, or is not supported for updates;\n- the new `field` does\
            \ not resolve to a `number` or `integer`\n  property on the operator's\
            \ latest active version, or the operator\n  no longer has an active `JSON`\
            \ version.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system
                      error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example,
                      a `params.twilioErrorCodeUrl` might hold a URL or link to additional
                      information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
              examples:
                field_not_resolvable:
                  value:
                    code: 20050
                    message: The 'field' value 'scores.leadScore' does not resolve
                      on the latest active version of operator 'intelligence_operator_01kcgy1ew0e9x8re6jq542zt8b'.
                    httpStatusCode: 400
                    userError: true
                field_not_updatable:
                  value:
                    code: 20053
                    message: The property 'name' cannot be updated.
                    httpStatusCode: 400
                    userError: true
                    params:
                      field: name
                source_type_mismatch:
                  value:
                    code: 20054
                    message: The 'sourceType' does not match the mapping's current
                      source type.
                    httpStatusCode: 400
                    userError: true
                    params:
                      expected: INTELLIGENCE_OPERATOR
                      actual: OTHER_SOURCE
        401:
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
