    get:
      summary: Retrieve asynchronous query status and results
      description: 'Poll the operation status. When status is COMPLETED, the response

        includes query results inline.

        When FAILED, the response includes error details conforming to the

        OperationError schema.

        '
      tags:
      - TwilioInsightsAsync
      operationId: FetchQueryJobStatus
      parameters:
      - name: operationId
        in: path
        required: true
        description: The unique identifier for the asynchronous query operation, in
          TTID format.
        schema:
          type: string
          format: Proc_JobTtid
          example: proc_job_01h9d8r0vte3hz8tykdj329t7r
      responses:
        '200':
          description: Operation status (may include results if COMPLETED)
          headers:
            Retry-After:
              description: Seconds before the client should poll again (present while
                PENDING/RUNNING).
              schema:
                type: integer
                example: 10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryJobStatusResponse'
              examples:
                running:
                  summary: Operation still running
                  value:
                    operationId: proc_job_01h9d8r0vte3hz8tykdj329t7r
                    status: RUNNING
                    createdAt: '2026-05-25T14:30:00Z'
                    statusUrl: https://insights.twilio.com/v3/InsightsDomains/Conversations/QueryJobs/proc_job_01h9d8r0vte3hz8tykdj329t7r
                completed:
                  summary: Operation completed
                  value:
                    operationId: proc_job_01h9d8r0vte3hz8tykdj329t7r
                    status: COMPLETED
                    createdAt: '2026-05-25T14:30:00Z'
                    completedAt: '2026-05-25T14:32:17Z'
                    statusUrl: https://insights.twilio.com/v3/InsightsDomains/Conversations/QueryJobs/proc_job_01h9d8r0vte3hz8tykdj329t7r
                    resultRetentionPeriod: P7D
                failed:
                  summary: Operation failed
                  value:
                    operationId: proc_job_01h9d8r0vte3hz8tykdj329t7r
                    status: FAILED
                    createdAt: '2026-05-25T14:30:00Z'
                    completedAt: '2026-05-25T14:30:12Z'
                    statusUrl: https://insights.twilio.com/v3/InsightsDomains/Conversations/QueryJobs/proc_job_01h9d8r0vte3hz8tykdj329t7r
                    error:
                      code: 50001
                      message: Query execution timeout exceeded
                      httpStatusCode: 504
                      detail: Query exceeded the 120s execution limit for this account.
